[general]
working_directory = "workspace"

[terminal.shell]
program = "/usr/bin/zsh"

[window]
dynamic_title = true
opacity = 0.96
resize_increments = true
title = ""

[window.dimensions]
columns = 83
lines = 20

[window.padding]
x = 10
y = 4

[font]
size = 11

[font.normal]
family = "FiraCode Nerd Font Light"

[mouse]
hide_when_typing = true

